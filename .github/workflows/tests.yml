name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
      - uses: actions/checkout@v4
        with:
          repository: vitodeploy/vito
          ref: '4.2.1'
          path: vito
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, zip, ftp, pdo_sqlite
          coverage: none
      - name: Install Vito dependencies
        working-directory: vito
        run: |
          touch .env
          composer install --prefer-dist --no-progress --no-interaction
      - name: Test plugin against stock Vito
        working-directory: plugin
        env:
          VITO_PATH: ${{ github.workspace }}/vito
        run: ../vito/vendor/bin/pest --configuration phpunit.xml
