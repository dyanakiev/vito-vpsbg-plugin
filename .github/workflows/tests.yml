name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 3
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
      - uses: actions/checkout@v4
        with:
          repository: vitodeploy/vito
          ref: '4.2.1'
          path: vito
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, zip, ftp, pdo_sqlite, redis
          coverage: none
      - name: Install Vito dependencies
        working-directory: vito
        run: |
          touch .env
          composer install --prefer-dist --no-progress --no-interaction
      - name: Test plugin against stock Vito
        working-directory: plugin
        env:
          VITO_PATH: ${{ github.workspace }}/vito
          VPSBG_TEST_REDIS: '1'
          REDIS_HOST: 127.0.0.1
        run: ../vito/vendor/bin/pest --configuration phpunit.xml
